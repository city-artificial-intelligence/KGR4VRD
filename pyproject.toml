[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kgr4vrd"
version = "0.1.0"
description = "Reproducible predicate classification with prepared ontology evidence"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = ["torch==2.2.2", "numpy==1.26.4", "Pillow==11.3.0", "rdflib==7.1.4", "owlrl==7.1.4"]

[project.optional-dependencies]
vision = ["torchvision==0.17.2"]
report = ["matplotlib==3.10.6"]

[project.scripts]
kgr4vrd = "kgr4vrd.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2", "build==1.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kgr4vrd"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "docs", "requirements", "legacy", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly supplied real backend or encoder"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/kgr4vrd"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
